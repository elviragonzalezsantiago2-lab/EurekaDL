[metadata]
name = EurekaDL
version = 0.1.0
description = EurekaDL - personal fork of OrpheusDL

[tool:pytest]
testpaths = tests

[options]
packages = find:
install_requires =

[options.entry_points]
console_scripts =
    eureka = eureka:main

[flake8]
max-line-length = 120
extend-ignore = E203, W503
